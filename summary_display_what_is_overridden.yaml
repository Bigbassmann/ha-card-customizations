type: custom:auto-entities
card:
  type: custom:mushroom-template-card
  primary: |
    Active Overrides: {{ states('sensor.active_automation_overrides') }}
  secondary: >
    {{ state_attr('sensor.active_automation_overrides', 'category_counts') |
    default('None active') }}


    {{ state_attr('sensor.active_automation_overrides', 'category_overrides') |
    default('None active') }}
  tertiary: >
    {% set overrides = state_attr('sensor.active_automation_overrides',
    'category_overrides') | default('None active') %} {% set counts =
    state_attr('sensor.active_automation_overrides', 'category_counts') |
    default('None active') %} {% if overrides != 'None active' %}
      {% set lines = overrides.split('\n') %}
      {% set ns = namespace(current_cat='', formatted='') %}
      {% for line in lines %}
        {% if line.endswith(':') %}
          {% set ns.current_cat = line[:-1] %}
          {% set cat_count = counts.split(ns.current_cat + ':')[1].split(',')[0] | int if ns.current_cat in counts else 0 %}
          {% set cat_color = 'blue' if cat_count > 0 else 'green' %}
          {% set ns.formatted = ns.formatted + " | <strong style=\"color: " + cat_color + ";\">" + ns.current_cat + ":</strong>" %}
        {% elif line.startswith(' - ') %}
          {% set ns.formatted = ns.formatted + " • " + line[3:] | truncate(40) %}
        {% endif %}
      {% endfor %}
      {{ ns.formatted | truncate(200) }}
    {% else %}
      None active
    {% endif %}
  icon: mdi:alert-circle-outline
  icon_color: >
    {% if states('sensor.active_automation_overrides')|int == 0 %}green{% else
    %}red{% endif %}
  multiline_secondary: true
  entity: sensor.active_automation_overrides
  tap_action:
    action: more-info
filter:
  include:
    - options: {}
      area: active_overrides
    - options: {}
      area: overrides_local
    - options: {}
      area: overrides_global
    - options: {}
      area: overrides_daniela
    - options: {}
      label: overrides
    - options: {}
      label: overrides_global
    - options: {}
      label: overrides_local
  exclude: []
grid_options:
  columns: full
visibility:
  - condition: numeric_state
    entity: sensor.active_automation_overrides
    above: 0
